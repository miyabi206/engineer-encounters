name: EngineerEncounters
options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "26.0"
  defaultConfig: Development
  developmentLanguage: ja
configs:
  Development: debug
  Internal: release
  Release: release
configFiles:
  Development: Config/Shared.xcconfig
  Internal: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
fileGroups:
  - Config
settings:
  base:
    SWIFT_VERSION: 6.0
  configs:
    Development:
      BACKEND_URL: $(DEVELOPMENT_BACKEND_URL)
      BACKEND_PUBLIC_KEY: $(DEVELOPMENT_BACKEND_PUBLIC_KEY)
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEVELOPMENT_BUILD
      EXCLUDED_SOURCE_FILE_NAMES: ""
      INFOPLIST_PREPROCESSOR_DEFINITIONS: DEVELOPMENT_BACKEND_NETWORKING=1
    # DevelopmentWelcomeView stays Development-only. DiagnosticsParticipationControl is
    # in App/Diagnostics, available in Development/Internal and excluded from Release.
    Internal:
      BACKEND_URL: $(INTERNAL_BACKEND_URL)
      BACKEND_PUBLIC_KEY: $(INTERNAL_BACKEND_PUBLIC_KEY)
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: INTERNAL_BUILD
      EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) $(SRCROOT)/App/Development/* DevelopmentDiagnostics.strings DevelopmentAccount.strings"
      INFOPLIST_PREPROCESSOR_DEFINITIONS: DEVELOPMENT_BACKEND_NETWORKING=0
    Release:
      BACKEND_URL: $(RELEASE_BACKEND_URL)
      BACKEND_PUBLIC_KEY: $(RELEASE_BACKEND_PUBLIC_KEY)
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) $(SRCROOT)/App/Development/* $(SRCROOT)/App/Diagnostics/* DevelopmentDiagnostics.strings DevelopmentAccount.strings Diagnostics.strings"
      INFOPLIST_PREPROCESSOR_DEFINITIONS: DEVELOPMENT_BACKEND_NETWORKING=0
packages:
  EncounterDomain:
    path: Packages/EncounterDomain
  EncounterBluetooth:
    path: Packages/EncounterBluetooth
  EncounterStorage:
    path: Packages/EncounterStorage
  EncounterBackend:
    path: Packages/EncounterBackend
  EncounterUI:
    path: Packages/EncounterUI
targets:
  EngineerEncounters:
    type: application
    platform: iOS
    sources:
      - App
      - path: SessionActivity
        excludes:
          - SessionActivityBundle.swift
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: SessionActivity
        embed: true
      - package: EncounterDomain
      - package: EncounterBluetooth
      - package: EncounterStorage
      - package: EncounterBackend
      - package: EncounterUI
  SessionActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - SessionActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).SessionActivity
        INFOPLIST_FILE: SessionActivity/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SESSION_ACTIVITY_EXTENSION"
        # No backend configuration is available in the rendering extension.
        BACKEND_URL: ""
        BACKEND_PUBLIC_KEY: ""
        DEVELOPMENT_BACKEND_URL: ""
        DEVELOPMENT_BACKEND_PUBLIC_KEY: ""
        INTERNAL_BACKEND_URL: ""
        INTERNAL_BACKEND_PUBLIC_KEY: ""
        RELEASE_BACKEND_URL: ""
        RELEASE_BACKEND_PUBLIC_KEY: ""
  EngineerEncountersTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "*.sh"
      # Hosted tests verify the build inputs without reading the private Local.xcconfig.
      - path: project.yml
        buildPhase: resources
      - path: Config/Shared.xcconfig
        buildPhase: resources
      - path: Config/Local.xcconfig.example
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).Tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: EngineerEncounters
      - package: EncounterDomain
        product: EncounterDomainTestSupport
schemes:
  EngineerEncounters:
    build:
      targets:
        EngineerEncounters: all
    run:
      config: Development
    test:
      config: Development
      targets:
        - name: EngineerEncountersTests
        - package: EncounterBluetooth/EncounterBluetoothTests
        - package: EncounterUI/EncounterUITests
    profile:
      config: Release
    analyze:
      config: Development
    archive:
      config: Release
